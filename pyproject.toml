[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "api4jenkins"
version = "2.2.0"
description = "Jenkins Python Client"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Joe Lee", email = "lj_2005@163.com"},
]
keywords = ["RESTAPI", "Jenkins"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Utilities",
]
dependencies = [
    "httpx >= 0.24.1",
]

[project.urls]
Documentation = "https://api4jenkins.readthedocs.io"
Source = "https://github.com/joelee2012/api4jenkins"

[tool.setuptools]
packages = ["api4jenkins"]

[tool.ruff.format]
# Prefer single quotes over double quotes.
quote-style = "single"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
